<div class="login-page">
  <div class="login-card">
    <div class="login-icon">
      <img src="newNubeero_NLogo.png" alt="Nubbank" class="login-icon__img">
    </div>

    <div class="login-brand">
      <h1 class="login-brand__name">Nubbank</h1>
    </div>

    <p class="login-tagline">Secure. Modern. Banking.</p>

    <button class="login-btn" (click)="signIn()">
      Sign In
      <span class="material-icons login-btn__icon">arrow_forward</span>
    </button>
  </div>

  <footer class="login-footer">
    &copy; {{ currentYear }} Nubeero. All rights reserved.
  </footer>
</div>
