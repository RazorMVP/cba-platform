<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <!-- Logo -->
  <div class="sidebar__logo">
    <span class="sidebar__logo-icon material-icons">account_balance</span>
    <span class="sidebar__logo-text" *ngIf="!collapsed">CBA Portal</span>
    <button class="sidebar__toggle" (click)="toggle.emit()">
      <span class="material-icons">{{ collapsed ? 'menu' : 'menu_open' }}</span>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    <div class="nav-group" *ngFor="let group of navGroups">
      <button class="nav-group__header" (click)="toggleGroup(group.label)">
        <span class="nav-group__label" *ngIf="!collapsed">{{ group.label }}</span>
        <span class="material-icons nav-group__chevron" *ngIf="!collapsed">
          {{ isGroupExpanded(group.label) ? 'expand_less' : 'expand_more' }}
        </span>
      </button>

      <div class="nav-group__items" *ngIf="isGroupExpanded(group.label) || collapsed">
        <a
          *ngFor="let item of group.items"
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="nav-item--active"
          [title]="collapsed ? item.label : ''"
        >
          <span class="material-icons nav-item__icon">{{ item.icon }}</span>
          <span class="nav-item__label" *ngIf="!collapsed">{{ item.label }}</span>
        </a>
      </div>
    </div>
  </nav>
</aside>
