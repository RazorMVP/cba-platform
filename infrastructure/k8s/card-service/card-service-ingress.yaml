# Replace card-api.cba.example.com with your actual domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: card-service-ingress
  namespace: cba-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Uncomment for TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # tls:
  #   - hosts:
  #       - card-api.cba.example.com
  #     secretName: card-service-tls
  rules:
    - host: card-api.cba.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: card-service
                port:
                  number: 8081
