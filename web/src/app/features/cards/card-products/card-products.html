<div class="page">
  <div class="page-header">
    <div><h1>Card Products</h1><p class="subtitle">Define card product templates and BIN ranges</p></div>
    <button class="btn-primary" (click)="openCreate()"><span class="material-symbols-outlined">add</span> New Product</button>
  </div>

  <div class="card-panel">
    <div *ngIf="loading" class="empty-state">Loading…</div>
    <div *ngIf="!loading && products.length === 0" class="empty-state">No card products defined.</div>
    <table *ngIf="!loading && products.length > 0" class="data-table">
      <thead><tr><th>Name</th><th>Type</th><th>BIN Range</th><th>Default Daily Limit</th></tr></thead>
      <tbody>
        <tr *ngFor="let p of products">
          <td><strong>{{ p.name }}</strong></td>
          <td><span [class]="typeClass(p.cardType)">{{ p.cardType }}</span></td>
          <td class="mono">{{ p.binRangeStart }} – {{ p.binRangeEnd }}</td>
          <td class="mono">{{ p.defaultDailyLimit | number:'1.0-0' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header"><h2>New Card Product</h2><button class="btn-icon" (click)="closeModal()"><span class="material-symbols-outlined">close</span></button></div>
    <div class="modal-body">
      <label>Product Name <input [(ngModel)]="form.name" /></label>
      <label>Card Type
        <select [(ngModel)]="form.cardType">
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </label>
      <label>BIN Range Start (8 digits) <input [(ngModel)]="form.binRangeStart" maxlength="8" /></label>
      <label>BIN Range End (8 digits) <input [(ngModel)]="form.binRangeEnd" maxlength="8" /></label>
      <label>Default Daily Limit (minor units) <input type="number" [(ngModel)]="form.defaultDailyLimit" /></label>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" (click)="closeModal()">Cancel</button>
      <button class="btn-primary" (click)="submit()">Create</button>
    </div>
  </div>
</div>
