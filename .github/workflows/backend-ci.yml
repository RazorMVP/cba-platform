name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cba-backend

jobs:
  # ─── API Documentation Consistency Enforcement ───────────────────────────────
  api-doc-check:
    name: API Contract Consistency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API docs are updated when controller annotations change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CONTROLLER_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" -- '*.java' \
            | grep -E '^\+.*@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)' \
            | grep -v '^+++' || true)

          if [ -z "$CONTROLLER_CHANGES" ]; then
            echo "No REST endpoint annotation changes detected — skipping doc check."
            exit 0
          fi

          echo "REST endpoint annotation changes found:"
          echo "$CONTROLLER_CHANGES"

          DOC_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" --name-only \
            | grep -E '(docs/openapi-snapshot\.yaml|docs/api-reference\.html|docs/cba-postman-collection-v2\.json)' \
            || true)

          if [ -z "$DOC_CHANGES" ]; then
            echo "FAIL: REST endpoint annotations changed but no API documentation was updated."
            echo "Update at least one of:"
            echo "  - backend/docs/openapi-snapshot.yaml  (mvn verify -Pfull-integration -Dupdate.api.snapshot=true)"
            echo "  - docs/api-reference.html"
            echo "  - docs/cba-postman-collection-v2.json"
            echo "See CLAUDE.md 'Mandatory Documentation Updates' for details."
            exit 1
          fi

          echo "API documentation updated alongside controller changes:"
          echo "$DOC_CHANGES"

  # ─── Unit + Integration Tests ────────────────────────────────────────────────
  test:
    name: Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        working-directory: backend
        run: mvn test --no-transfer-progress

      - name: Run integration tests (Testcontainers + PostgreSQL)
        working-directory: backend
        run: mvn verify -Pfull-integration --no-transfer-progress -Djacoco.skip=true -Dspotbugs.skip=true
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  # ─── Code Quality — SonarCloud ───────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ vars.SONAR_ORG }}
        run: |
          mvn verify sonar:sonar \
            -Djacoco.check.skip=true \
            -Dsonar.projectKey=cba-platform_backend \
            -Dsonar.organization="${SONAR_ORG}" \
            -Dsonar.host.url=https://sonarcloud.io \
            --no-transfer-progress

  # ─── Security — OWASP Dependency Check ───────────────────────────────────────
  # NOTE: First run downloads ~346K NVD records (~70 min locally, ~3h in CI).
  # Subsequent runs do a delta update (seconds) using the owasp-nvd-* cache key.
  # timeout-minutes: 180 covers the worst-case first-time download.
  # Suppressions: docs/owasp-suppressions.xml (Netty/Spring/Tomcat justified 2026-04-24)
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # Was 180. With the mirror + a cache that is actually saved, a run is minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # restore/save split, NOT plain actions/cache: plain actions/cache only saves
      # when the job succeeds, and this job fails on any CVSS >= 7 finding — so the
      # NVD cache was never written. The old key (hash of pom.xml) also never
      # refreshed once saved. Now: one entry per day, saved even on failure.
      # Same key prefix as card-service-ci.yml, so the two jobs share the database.
      - name: Compute NVD cache key
        id: nvd-key
        run: echo "key=owasp-nvd-${{ runner.os }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Plugin pinned (was unpinned → newest on every run). `hoursToWaitBeforeChecking`
        # is not a dependency-check property and was silently ignored; the real one is
        # nvdValidForHours. OSS Index now requires credentials, so it's disabled explicitly.
        run: |
          mvn org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=../docs/owasp-suppressions.xml \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DnvdMaxRetryCount=5 \
            -DnvdApiDelay=2000 \
            -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/ \
            -DnvdValidForHours=24 \
            -DretireJsAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false \
            -DassemblyAnalyzerEnabled=false \
            -DossIndexAnalyzerEnabled=false \
            --no-transfer-progress

      - name: Save NVD database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html

  # ─── Security — SpotBugs Static Analysis ─────────────────────────────────────
  spotbugs:
    name: SpotBugs Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run SpotBugs
        working-directory: backend
        run: mvn compile spotbugs:check --no-transfer-progress

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml

  # ─── Docker Build + Push ─────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, owasp-check, spotbugs, api-doc-check]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.test.result == 'success' &&
      needs.owasp-check.result == 'success' &&
      needs.spotbugs.result == 'success' &&
      (needs.api-doc-check.result == 'success' || needs.api-doc-check.result == 'skipped')
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR (skip tests — already ran)
        working-directory: backend
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cba-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Trivy image ref
        run: |
          LOWER_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "TRIVY_IMAGE_REF=ghcr.io/${LOWER_OWNER}/cba-platform/cba-backend:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TRIVY_IMAGE_REF }}
          format: sarif
          output: trivy-docker.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-docker.sarif

  # ─── Deploy ──────────────────────────────────────────────────────────────────
  # Rewritten Session 125 cont. 10 — the previous jobs could never have deployed:
  #  1. Skip propagation: api-doc-check is PR-only, so on a push it is SKIPPED. A plain
  #     job-level `if` carries an implicit success() that sees that skip through `docker`
  #     and skips the deploy even when docker succeeded. Hence always() + an explicit
  #     needs.docker.result check.
  #  2-5. The image rewrite targeted a file that does not exist (deployment.yaml vs
  #     <service>-deployment.yaml), searched for the wrong image (cba/<svc>:latest), wrote the
  #     full 40-char SHA while metadata-action pushes the 7-char one, and used the
  #     mixed-case github.repository (not a valid OCI reference). It now rewrites the real
  #     line to ghcr.io/<lowercase repo>/<image>:sha-<7> and FAILS if nothing changed, so a
  #     rollout can never silently keep :latest.
  #  6. (backend) `kubectl apply -f infrastructure/k8s/` is not recursive, so it applied
  #     only namespace.yaml. Each job now applies ONLY its own service directory — NOT
  #     `-R` on the whole tree, which would push secrets/ with its <CHANGE_ME> placeholders
  #     over real cluster secrets. Namespace, secrets, configmaps and data stores are a
  #     one-time cluster bootstrap, not part of a per-service deploy.
  #  7. The rollout waited on deployment/cba-<svc>; the Deployments are named <svc>.
  # No cluster is configured yet (docs/deferred-backlog.md item 8): each job checks for
  # its kubeconfig secret first and skips cleanly with a notice when it is absent, so a
  # missing cluster reports as "not configured" rather than a red main.

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && github.ref == 'refs/heads/develop'
    environment: staging
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
    steps:
      - name: Check cluster credentials
        id: creds
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::notice title=Deploy skipped::KUBE_CONFIG_STAGING is not set - no cluster is configured. See docs/deferred-backlog.md item 8."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - name: Set up kubectl
        if: steps.creds.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Pin the image to this commit
        if: steps.creds.outputs.configured == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/cba-backend:sha-${GITHUB_SHA::7}"
          MANIFEST="infrastructure/k8s/backend/backend-deployment.yaml"
          sed -i -E "s|image: ghcr\.io/[^[:space:]]+/cba-backend:[^[:space:]]+|image: ${IMAGE}|" "$MANIFEST"
          grep -q "image: ${IMAGE}$" "$MANIFEST" \
            || { echo "::error::image not rewritten in $MANIFEST - refusing to deploy :latest"; exit 1; }
          echo "Deploying ${IMAGE}"

      - name: Apply backend manifests
        if: steps.creds.outputs.configured == 'true'
        run: kubectl apply -f infrastructure/k8s/backend/ --kubeconfig="$RUNNER_TEMP/kubeconfig"

      - name: Wait for rollout
        if: steps.creds.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/backend \
            -n cba-platform \
            --kubeconfig="$RUNNER_TEMP/kubeconfig" \
            --timeout=300s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && github.ref == 'refs/heads/main'
    environment: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
    steps:
      - name: Check cluster credentials
        id: creds
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::notice title=Deploy skipped::KUBE_CONFIG_PROD is not set - no cluster is configured. See docs/deferred-backlog.md item 8."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - name: Set up kubectl
        if: steps.creds.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Pin the image to this commit
        if: steps.creds.outputs.configured == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/cba-backend:sha-${GITHUB_SHA::7}"
          MANIFEST="infrastructure/k8s/backend/backend-deployment.yaml"
          sed -i -E "s|image: ghcr\.io/[^[:space:]]+/cba-backend:[^[:space:]]+|image: ${IMAGE}|" "$MANIFEST"
          grep -q "image: ${IMAGE}$" "$MANIFEST" \
            || { echo "::error::image not rewritten in $MANIFEST - refusing to deploy :latest"; exit 1; }
          echo "Deploying ${IMAGE}"

      - name: Apply backend manifests
        if: steps.creds.outputs.configured == 'true'
        run: kubectl apply -f infrastructure/k8s/backend/ --kubeconfig="$RUNNER_TEMP/kubeconfig"

      - name: Wait for rollout
        if: steps.creds.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/backend \
            -n cba-platform \
            --kubeconfig="$RUNNER_TEMP/kubeconfig" \
            --timeout=300s
