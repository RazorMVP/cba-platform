name: Web CI/CD (Angular → Vercel)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── NOTE ──────────────────────────────────────────────────────────────────────
# Angular web/ is the production frontend (restored Session 59).
# React web-react/ is parked — no CI job until it reaches feature parity.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ─── Change detection ────────────────────────────────────────────────────────
  # Path filtering happens here, not in `on:`, so the gate below reports on EVERY
  # pull request. A required check whose workflow never triggers stays "Expected"
  # forever and blocks unrelated PRs.
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          PATTERN: '^(web/|\.github/workflows/web\-ci\.yml$)'
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          # New branch, force push or unknown base: run everything rather than guess.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Lint + Unit Tests ────────────────────────────────────────────────────────
  test:
    name: Lint & Test (Angular)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint --max-warnings=0 || true

      - name: Unit tests (Karma)
        run: npx ng test --watch=false --coverage

      # Proves the app compiles for production without Vercel secrets, which
      # Dependabot and fork PRs don't get; the Web CI gate relies on this.
      - name: Production build
        run: npx ng build --configuration production

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: web/coverage
          flags: angular

  # ─── Security — npm audit ─────────────────────────────────────────────────────
  security:
    name: Security Audit (npm)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # ─── Production Build + Vercel Deploy ─────────────────────────────────────────
  deploy:
    name: Build & Deploy → Vercel
    runs-on: ubuntu-latest
    needs: [test, security]
    # The repo's default token is read-only; commenting the preview URL on the
    # PR needs pull-requests: write. Nothing else in this job writes to GitHub.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      vercel-url: ${{ steps.deploy-preview.outputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # The build target must match the deploy target: `vercel deploy --prebuilt`
      # refuses a production build for a preview deploy. Only a push to main
      # deploys with --prod; PRs and develop deploy previews.
      - name: Pull Vercel environment (preview)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Pull Vercel environment (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Angular (preview)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: vercel build --token="${VERCEL_TOKEN}"

      - name: Build Angular (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy preview to Vercel
        if: github.event_name == 'pull_request'
        id: deploy-preview
        run: |
          URL=$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${URL}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## CBA Web Portal — Preview Deployment (Angular)',
                '',
                `**URL**: ${previewUrl}`,
                '',
                '> Auto-deployed by the Web CI pipeline.',
              ].join('\n')
            });

      - name: Deploy to Vercel (develop → staging)
        if: github.ref == 'refs/heads/develop'
        run: vercel deploy --prebuilt --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel (main → production)
        if: github.ref == 'refs/heads/main'
        id: deploy-prod
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Production URL: ${URL}"

  # ─── E2E Tests Against Preview ────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          BASE_URL: ${{ needs.deploy.outputs.vercel-url }}
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

  # ─── Required check ──────────────────────────────────────────────────────────
  # The one check the `main` ruleset requires for this workflow. Passes when the
  # jobs below succeeded or were skipped (nothing relevant changed); fails if any
  # failed or was cancelled. Named uniquely: backend and card-service share job
  # names, so requiring e.g. "OWASP Dependency Check" would match either.
  gate:
    name: Web CI gate
    if: always()
    needs: [changes, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gated job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
