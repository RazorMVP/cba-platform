server:
  port: 8081

spring:
  application:
    name: card-service

  datasource:
    url: jdbc:postgresql://localhost:5432/card_db
    username: ${DB_USERNAME:cba}
    password: ${DB_PASSWORD:cba_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/cba}

  cache:
    type: simple

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Jasypt encryption (PAN / CVV field-level encryption)
jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    password: ${ENCRYPTION_KEY:dev-encryption-key-change-in-prod}
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

# Card service specific config
card:
  pan:
    hmac-key: ${PAN_HMAC_KEY:dev-pan-hmac-key-change-in-prod}
  token:
    bin-prefix: "9999"          # DPAN BIN prefix — triggers de-tokenization in FEP
  fraud:
    approve-threshold: 30       # Score < 30 → APPROVE
    step-up-threshold: 70       # Score 30-69 → STEP_UP; ≥70 → DECLINE
  settlement:
    auth-expiry-days: 7         # Unmatched authorizations reversed after 7 days
  tap-limit:                    # Single-message (real-time) threshold per ISO 4217 numeric code (minor units)
    "840": 2500                 # USD: $25.00 (2500 cents)
    "404": 350000               # KES: 3,500 KES (350000 cents)
    "288": 30000                # GHS: 300 GHS (30000 pesewas)
  threeds:
    cavv-master-key: ${THREEDS_CAVV_MASTER_KEY:dev-cavv-master-key-change-in-prod}
    frictionless-limits:        # Per-currency frictionless threshold in minor units (ISO 4217 numeric code keys)
      "840": 5000               # USD: $50.00 (5000 cents)
      "404": 700000             # KES: 7,000 KES (700000 cents)
      "288": 50000              # GHS: 500 GHS (50000 pesewas)
      "566": 7500000            # NGN: 75,000 NGN (7500000 kobo)
      "default": 5000           # Fallback for any unlisted currency
    otp-expiry-minutes: 10      # OTP valid for 10 minutes
    max-otp-attempts: 3         # Lock session after 3 failed OTP attempts
    acs-base-url: ${ACS_BASE_URL:http://localhost:8081}  # Used in ARes.acsURL for challenge redirect
  simulator:
    default-currency: "840"     # ISO 4217 numeric code used when test requests omit currency field — override per deployment

# Monolith backend (for balance checks)
backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:8080}

# FEP TCP socket (for terminal simulator)
fep:
  host: ${FEP_HOST:localhost}
  tcp-port: ${FEP_TCP_PORT:8583}
  connect-timeout-ms: 5000
  read-timeout-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cba.card: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
