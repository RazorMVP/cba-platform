server:
  port: 8081

spring:
  application:
    name: card-service

  datasource:
    url: jdbc:postgresql://localhost:5432/card_db
    username: ${DB_USERNAME:cba}
    password: ${DB_PASSWORD:cba_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/cba}

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Jasypt encryption (PAN / CVV field-level encryption)
jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    password: ${ENCRYPTION_KEY:dev-encryption-key-change-in-prod}
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

# Application-level toggles
app:
  # Dev-only: when true, DevAuthBypassFilter injects a fake ADMIN principal so the
  # authBypass-mode Angular backoffice can call /api/v1/cards/** and /card-api/v1/**
  # without a Keycloak token. MUST stay false in production (override with
  # APP_AUTH_BYPASS=true for local dev only). The bypass bean is @ConditionalOnProperty,
  # so at false/absent it is never created.
  auth-bypass: ${APP_AUTH_BYPASS:false}

# Card service specific config
card:
  pan:
    hmac-key: ${PAN_HMAC_KEY:dev-pan-hmac-key-change-in-prod}
  token:
    bin-prefix: "9999"          # DPAN BIN prefix — triggers de-tokenization in FEP
  fraud:
    approve-threshold: 30       # Score < 30 → APPROVE
    step-up-threshold: 70       # Score 30-69 → STEP_UP; ≥70 → DECLINE
  tap-limit:                    # Single-message (real-time) threshold per ISO 4217 numeric code (minor units)
    "840": 2500                 # USD: $25.00 (2500 cents)
    "404": 350000               # KES: 3,500 KES (350000 cents)
    "288": 30000                # GHS: 300 GHS (30000 pesewas)
  threeds:
    cavv-master-key: ${THREEDS_CAVV_MASTER_KEY:dev-cavv-master-key-change-in-prod}
    frictionless-limits:        # Per-currency frictionless threshold in minor units (ISO 4217 numeric code keys)
      "840": 5000               # USD: $50.00 (5000 cents)
      "404": 700000             # KES: 7,000 KES (700000 cents)
      "288": 50000              # GHS: 500 GHS (50000 pesewas)
      "566": 7500000            # NGN: 75,000 NGN (7500000 kobo)
      "default": 5000           # Fallback for any unlisted currency
    otp-expiry-minutes: 10      # OTP valid for 10 minutes
    max-otp-attempts: 3         # Lock session after 3 failed OTP attempts
    acs-base-url: ${ACS_BASE_URL:http://localhost:8081}  # Used in ARes.acsURL for challenge redirect
  simulator:
    default-currency: "840"     # ISO 4217 numeric code used when test requests omit currency field — override per deployment
  bureau:
    name: ${BUREAU_NAME:CBA_BUREAU}   # Configured bureau name — e.g. THALES_HID, IDEMIA, HID_GLOBAL
  settlement:
    auth-expiry-days: 7         # Unmatched authorizations reversed after 7 days
    export:
      acquirer-bin: ${ACQUIRER_BIN:000000}     # Bank's BIN — embedded in all scheme file headers
      member-id: ${MEMBER_ID:CBA001}           # Scheme membership identifier
      export-cron: "0 58 23 * * *"             # Nightly export at 23:58 — runs after settlement batch closes at 23:57
      max-retries: 3
      retry-delay-seconds: 300                 # 5 minutes between retries
      schemes:
        visa:
          enabled: false                       # Set true + configure credentials at production
          sftp-host: ${VISA_SFTP_HOST:visanet.visa.com}
          sftp-port: ${VISA_SFTP_PORT:22}
          sftp-user: ${VISA_SFTP_USER:}
          sftp-key-path: ${VISA_SFTP_KEY_PATH:}
          remote-dir: ${VISA_SFTP_DIR:/incoming}
          participant-id: ${VISA_PARTICIPANT_ID:}
        mastercard:
          enabled: false
          sftp-host: ${MC_SFTP_HOST:banknet.mastercard.com}
          sftp-port: ${MC_SFTP_PORT:22}
          sftp-user: ${MC_SFTP_USER:}
          sftp-key-path: ${MC_SFTP_KEY_PATH:}
          remote-dir: ${MC_SFTP_DIR:/incoming}
          participant-id: ${MC_PARTICIPANT_ID:}
        verve:
          enabled: false
          sftp-host: ${VERVE_SFTP_HOST:nibss-plc.com.ng}
          sftp-port: ${VERVE_SFTP_PORT:22}
          sftp-user: ${VERVE_SFTP_USER:}
          sftp-key-path: ${VERVE_SFTP_KEY_PATH:}
          remote-dir: ${VERVE_SFTP_DIR:/settlement}
          participant-id: ${VERVE_PARTICIPANT_ID:}
        afrigo:
          enabled: false
          https-endpoint: ${PAPSS_ENDPOINT:https://gateway.papss.com/settlement}
          https-api-key: ${PAPSS_API_KEY:}
          participant-id: ${PAPSS_PARTICIPANT_ID:}
        unionpay:
          enabled: false
          sftp-host: ${CUP_SFTP_HOST:cups.unionpay.com}
          sftp-port: ${CUP_SFTP_PORT:22}
          sftp-user: ${CUP_SFTP_USER:}
          sftp-key-path: ${CUP_SFTP_KEY_PATH:}
          remote-dir: ${CUP_SFTP_DIR:/incoming}
          participant-id: ${CUP_PARTICIPANT_ID:}

# Monolith backend (for balance checks)
backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:8080}

# FEP TCP socket (for terminal simulator)
fep:
  host: ${FEP_HOST:localhost}
  tcp-port: ${FEP_TCP_PORT:8583}
  connect-timeout-ms: 5000
  read-timeout-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cba.card: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
