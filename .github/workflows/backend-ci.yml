name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cba-backend

jobs:
  # ─── API Documentation Consistency Enforcement ───────────────────────────────
  api-doc-check:
    name: API Contract Consistency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API docs are updated when controller annotations change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CONTROLLER_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" -- '*.java' \
            | grep -E '^\+.*@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)' \
            | grep -v '^+++' || true)

          if [ -z "$CONTROLLER_CHANGES" ]; then
            echo "No REST endpoint annotation changes detected — skipping doc check."
            exit 0
          fi

          echo "REST endpoint annotation changes found:"
          echo "$CONTROLLER_CHANGES"

          DOC_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" --name-only \
            | grep -E '(docs/openapi-snapshot\.yaml|docs/api-reference\.html|docs/cba-postman-collection-v2\.json)' \
            || true)

          if [ -z "$DOC_CHANGES" ]; then
            echo "FAIL: REST endpoint annotations changed but no API documentation was updated."
            echo "Update at least one of:"
            echo "  - backend/docs/openapi-snapshot.yaml  (mvn verify -Pfull-integration -Dupdate.api.snapshot=true)"
            echo "  - docs/api-reference.html"
            echo "  - docs/cba-postman-collection-v2.json"
            echo "See CLAUDE.md 'Mandatory Documentation Updates' for details."
            exit 1
          fi

          echo "API documentation updated alongside controller changes:"
          echo "$DOC_CHANGES"

  # ─── Unit + Integration Tests ────────────────────────────────────────────────
  test:
    name: Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        working-directory: backend
        run: mvn test --no-transfer-progress

      - name: Run integration tests (Testcontainers + PostgreSQL)
        working-directory: backend
        run: mvn verify -Pfull-integration --no-transfer-progress -Djacoco.skip=true -Dspotbugs.skip=true
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  # ─── Code Quality — SonarCloud ───────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ vars.SONAR_ORG }}
        run: |
          mvn verify sonar:sonar \
            -Djacoco.check.skip=true \
            -Dsonar.projectKey=cba-platform_backend \
            -Dsonar.organization="${SONAR_ORG}" \
            -Dsonar.host.url=https://sonarcloud.io \
            --no-transfer-progress

  # ─── Security — OWASP Dependency Check ───────────────────────────────────────
  # NOTE: First run downloads ~346K NVD records (~70 min locally, ~3h in CI).
  # Subsequent runs do a delta update (seconds) using the owasp-nvd-* cache key.
  # timeout-minutes: 180 covers the worst-case first-time download.
  # Suppressions: docs/owasp-suppressions.xml (Netty/Spring/Tomcat justified 2026-04-24)
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # Was 180. With the mirror + a cache that is actually saved, a run is minutes.
    timeout-minutes: 45
    # ADVISORY, not blocking (Session 125 cont. 7). The findings on the current
    # Spring Boot release have NO published fix — spring-core 6.2.19 and
    # spring-security-core 6.5.11 are the newest in their lines and still carry
    # CVSS 9.x CVEs — so -DfailBuildOnCVSS=7 is unsatisfiable by upgrading.
    # Leaving it blocking meant NO backend or card-service image was built on main
    # from July 2026 onward. The report still runs every push and uploads as an
    # artifact.
    # ⚠️ KNOW WHAT THIS COSTS: this was the ONLY gate that failed a build on a CVE
    # in an *existing* Java dependency. Snyk's steps are continue-on-error and the
    # Trivy scans set no exit-code, so both only report; Dependabot raises alerts,
    # it is not a gate. What still blocks: `dependency-review` (PRs only, and only
    # dependencies CHANGED in that PR) and `npm audit` (web/ only, not Java).
    # Revisit (drop continue-on-error) once upstream ships the fixes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # restore/save split, NOT plain actions/cache: plain actions/cache only saves
      # when the job succeeds, and this job fails on any CVSS >= 7 finding — so the
      # NVD cache was never written. The old key (hash of pom.xml) also never
      # refreshed once saved. Now: one entry per day, saved even on failure.
      # Same key prefix as card-service-ci.yml, so the two jobs share the database.
      - name: Compute NVD cache key
        id: nvd-key
        run: echo "key=owasp-nvd-${{ runner.os }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Plugin pinned (was unpinned → newest on every run). `hoursToWaitBeforeChecking`
        # is not a dependency-check property and was silently ignored; the real one is
        # nvdValidForHours. OSS Index now requires credentials, so it's disabled explicitly.
        run: |
          mvn org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=../docs/owasp-suppressions.xml \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DnvdMaxRetryCount=5 \
            -DnvdApiDelay=2000 \
            -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/ \
            -DnvdValidForHours=24 \
            -DretireJsAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false \
            -DassemblyAnalyzerEnabled=false \
            -DossIndexAnalyzerEnabled=false \
            --no-transfer-progress

      - name: Save NVD database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html

  # ─── Security — SpotBugs Static Analysis ─────────────────────────────────────
  spotbugs:
    name: SpotBugs Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run SpotBugs
        working-directory: backend
        run: mvn compile spotbugs:check --no-transfer-progress

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml

  # ─── Docker Build + Push ─────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, owasp-check, spotbugs, api-doc-check]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.test.result == 'success' &&
      needs.spotbugs.result == 'success' &&
      (needs.api-doc-check.result == 'success' || needs.api-doc-check.result == 'skipped')
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR (skip tests — already ran)
        working-directory: backend
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cba-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Trivy image ref
        run: |
          LOWER_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "TRIVY_IMAGE_REF=ghcr.io/${LOWER_OWNER}/cba-platform/cba-backend:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TRIVY_IMAGE_REF }}
          format: sarif
          output: trivy-docker.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-docker.sarif

  # ─── Deploy to Staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig.yml

      - name: Update image in manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository }}/cba-backend
        run: |
          sed -i "s|cba/backend:latest|${REGISTRY}:${IMAGE_TAG}|g" \
            infrastructure/k8s/backend/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f infrastructure/k8s/ --kubeconfig=/tmp/kubeconfig.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cba-backend \
            -n cba-platform \
            --kubeconfig=/tmp/kubeconfig.yml \
            --timeout=300s

  # ─── Deploy to Production ─────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig.yml

      - name: Update image in manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository }}/cba-backend
        run: |
          sed -i "s|cba/backend:latest|${REGISTRY}:${IMAGE_TAG}|g" \
            infrastructure/k8s/backend/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f infrastructure/k8s/ --kubeconfig=/tmp/kubeconfig.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cba-backend \
            -n cba-platform \
            --kubeconfig=/tmp/kubeconfig.yml \
            --timeout=300s
