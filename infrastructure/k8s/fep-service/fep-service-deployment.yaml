apiVersion: apps/v1
kind: Deployment
metadata:
  name: fep-service
  namespace: cba-platform
  labels:
    app: fep-service
    app.kubernetes.io/part-of: cba-platform
spec:
  # Fixed replica count — TCP connection state means HPA is not appropriate
  # for the FEP. Scale horizontally by adding replicas here manually and
  # placing a TCP load balancer (e.g. MetalLB + L4 LB) in front.
  replicas: 2
  selector:
    matchLabels:
      app: fep-service
  template:
    metadata:
      labels:
        app: fep-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fep-service
          image: ghcr.io/razormvp/cba-platform/cba-fep-service:latest
          ports:
            - name: http
              containerPort: 8082
            - name: iso8583
              containerPort: 8583
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fep-service-config
          env:
            - name: FEP_HSM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: fep-service-secret
                  key: FEP_HSM_PROVIDER
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
