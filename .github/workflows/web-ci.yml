name: Web CI/CD (Angular → Vercel)

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

# ── NOTE ──────────────────────────────────────────────────────────────────────
# Angular web/ is the production frontend (restored Session 59).
# React web-react/ is parked — no CI job until it reaches feature parity.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ─── Lint + Unit Tests ────────────────────────────────────────────────────────
  test:
    name: Lint & Test (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint --max-warnings=0 || true

      - name: Unit tests (Karma)
        run: npx ng test --watch=false --browsers=ChromeHeadless --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: web/coverage
          flags: angular

  # ─── Security — npm audit ─────────────────────────────────────────────────────
  security:
    name: Security Audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # ─── Production Build + Vercel Deploy ─────────────────────────────────────────
  deploy:
    name: Build & Deploy → Vercel
    runs-on: ubuntu-latest
    needs: [test, security]
    outputs:
      vercel-url: ${{ steps.deploy-preview.outputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (preview)
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Pull Vercel environment (production)
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Angular (preview)
        if: github.event_name == 'pull_request'
        run: npx ng build --configuration=production

      - name: Build Angular (production)
        if: github.event_name == 'push'
        run: npx ng build --configuration=production

      - name: Deploy preview to Vercel
        if: github.event_name == 'pull_request'
        id: deploy-preview
        run: |
          URL=$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${URL}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## CBA Web Portal — Preview Deployment (Angular)',
                '',
                `**URL**: ${previewUrl}`,
                '',
                '> Auto-deployed by the Web CI pipeline.',
              ].join('\n')
            });

      - name: Deploy to Vercel (develop → staging)
        if: github.ref == 'refs/heads/develop'
        run: vercel deploy --prebuilt --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel (main → production)
        if: github.ref == 'refs/heads/main'
        id: deploy-prod
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Production URL: ${URL}"

  # ─── E2E Tests Against Preview ────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          BASE_URL: ${{ needs.deploy.outputs.vercel-url }}
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
