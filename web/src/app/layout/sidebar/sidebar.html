<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <!-- Logo -->
  <div class="sidebar__logo">
    <span class="sidebar__logo-icon material-icons">account_balance</span>
    @if (!collapsed) {
      <span class="sidebar__logo-text">CBA Portal</span>
    }
    <button class="sidebar__toggle" (click)="sidebarToggle.emit()">
      <span class="material-icons">{{ collapsed ? 'menu' : 'menu_open' }}</span>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    @for (group of navGroups; track group.label) {
      <div class="nav-group">
        <button class="nav-group__header" (click)="toggleGroup(group.label)">
          @if (!collapsed) {
            <span class="nav-group__label">{{ group.label }}</span>
            <span class="material-icons nav-group__chevron">
              {{ isGroupExpanded(group.label) ? 'expand_less' : 'expand_more' }}
            </span>
          }
        </button>

        @if (isGroupExpanded(group.label) || collapsed) {
          <div class="nav-group__items">
            @for (item of group.items; track item.route) {
              <a
                class="nav-item"
                [routerLink]="item.route"
                routerLinkActive="nav-item--active"
                [title]="collapsed ? item.label : ''"
              >
                <span class="material-icons nav-item__icon">{{ item.icon }}</span>
                @if (!collapsed) {
                  <span class="nav-item__label">{{ item.label }}</span>
                }
              </a>
            }
          </div>
        }
      </div>
    }
  </nav>
</aside>
