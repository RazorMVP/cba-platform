---
components:
  schemas:
    Account:
      properties:
        accountNumber:
          type: "string"
        accountType:
          enum:
          - "SAVINGS"
          - "CHECKING"
          - "FIXED_DEPOSIT"
          type: "string"
        balance:
          type: "number"
        closedDate:
          format: "date"
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        createdBy:
          type: "string"
        currencyCode:
          type: "string"
        customer:
          $ref: "#/components/schemas/Customer"
        id:
          format: "uuid"
          type: "string"
        lastTransactionDate:
          format: "date"
          type: "string"
        openedDate:
          format: "date"
          type: "string"
        product:
          $ref: "#/components/schemas/DepositProduct"
        status:
          enum:
          - "SUBMITTED"
          - "APPROVED"
          - "ACTIVE"
          - "FROZEN"
          - "DORMANT"
          - "REJECTED"
          - "CLOSED"
          type: "string"
        tenantId:
          format: "uuid"
          type: "string"
        updatedAt:
          format: "date-time"
          type: "string"
        updatedBy:
          type: "string"
        version:
          format: "int64"
          type: "integer"
      type: "object"
    AccountHoldRequest:
      properties:
        amount:
          minimum: 0.01
          type: "number"
        expiryDate:
          format: "date"
          type: "string"
        reason:
          minLength: 1
          type: "string"
      required:
      - "amount"
      type: "object"
    AccountHoldResponse:
      properties:
        accountId:
          format: "uuid"
          type: "string"
        amount:
          type: "number"
        createdAt:
          format: "date-time"
