          format: "uuid"
          type: "string"
        reason:
          type: "string"
        referenceNumber:
          type: "string"
        releasedAt:
          format: "date-time"
          type: "string"
        releasedBy:
          type: "string"
        status:
          enum:
          - "ACTIVE"
          - "RELEASED"
          - "EXPIRED"
          type: "string"
      type: "object"
    AccountNumberFormat:
      properties:
        accountType:
