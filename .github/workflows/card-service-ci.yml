name: Card Service CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'card-service/**'
      - '.github/workflows/card-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'card-service/**'
      - '.github/workflows/card-service-ci.yml'

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cba-card-service

jobs:
  # ─── API Documentation Consistency Enforcement ───────────────────────────────
  api-doc-check:
    name: API Contract Consistency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check API docs updated when controller annotations change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CONTROLLER_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" -- '*.java' \
            | grep -E '^\+.*@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)' \
            | grep -v '^+++' || true)

          if [ -z "$CONTROLLER_CHANGES" ]; then
            echo "No REST endpoint annotation changes — skipping doc check."
            exit 0
          fi

          echo "REST endpoint annotation changes found:"
          echo "$CONTROLLER_CHANGES"

          DOC_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" --name-only \
            | grep -E '(card-service/docs/openapi-snapshot\.yaml|docs/card-api-reference\.html|docs/cba-postman-collection-v2\.json)' \
            || true)

          if [ -z "$DOC_CHANGES" ]; then
            echo "FAIL: Controller annotations changed without updating card-service API docs."
            echo "Update one of:"
            echo "  - card-service/docs/openapi-snapshot.yaml"
            echo "  - docs/card-api-reference.html"
            echo "  - docs/cba-postman-collection-v2.json"
            exit 1
          fi

          echo "API docs updated alongside controller changes: $DOC_CHANGES"

  # ─── Unit + Integration Tests ─────────────────────────────────────────────────
  test:
    name: Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        working-directory: card-service
        run: mvn test --no-transfer-progress

      - name: Run integration tests (Testcontainers + OpenAPI snapshot)
        working-directory: card-service
        run: mvn verify -Pfull-integration --no-transfer-progress
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-service-test-reports
          path: card-service/target/surefire-reports/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Card Service Tests
          path: card-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-empty: false

  # ─── Security — OWASP Dependency Check ───────────────────────────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run OWASP Dependency Check
        working-directory: card-service
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=../docs/owasp-suppressions.xml \
            -DnvdApiKey="$NVD_API_KEY" \
            -DnvdMaxRetryCount=5 \
            -DnvdApiDelay=2000 \
            -DretireJsAnalyzerEnabled=false \
            --no-transfer-progress

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-service-owasp-report
          path: card-service/target/dependency-check-report.html

  # ─── Docker Build + Push ─────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, owasp-check, api-doc-check]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.test.result == 'success' &&
      needs.owasp-check.result == 'success' &&
      (needs.api-doc-check.result == 'success' || needs.api-doc-check.result == 'skipped')
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR (skip tests)
        working-directory: card-service
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cba-card-service
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: card-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Trivy image ref
        run: |
          LOWER_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "TRIVY_IMAGE_REF=ghcr.io/${LOWER_OWNER}/cba-platform/cba-card-service:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TRIVY_IMAGE_REF }}
          format: sarif
          output: trivy-card-service.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-card-service.sarif

  # ─── Deploy to Staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig.yml

      - name: Update image in k8s manifests
        env:
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
        run: |
          sed -i "s|cba/card-service:latest|ghcr.io/${{ github.repository }}/cba-card-service:sha-$(git rev-parse HEAD)|g" \
            infrastructure/k8s/card-service/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f infrastructure/k8s/card-service/ --kubeconfig=/tmp/kubeconfig.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cba-card-service \
            -n cba-platform \
            --kubeconfig=/tmp/kubeconfig.yml \
            --timeout=300s

  # ─── Deploy to Production ─────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig.yml

      - name: Update image in k8s manifests
        run: |
          sed -i "s|cba/card-service:latest|ghcr.io/${{ github.repository }}/cba-card-service:sha-$(git rev-parse HEAD)|g" \
            infrastructure/k8s/card-service/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f infrastructure/k8s/card-service/ --kubeconfig=/tmp/kubeconfig.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cba-card-service \
            -n cba-platform \
            --kubeconfig=/tmp/kubeconfig.yml \
            --timeout=300s
