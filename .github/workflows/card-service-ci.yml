name: Card Service CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'card-service/**'
      - '.github/workflows/card-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'card-service/**'
      - '.github/workflows/card-service-ci.yml'

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cba-card-service

jobs:
  # ─── API Documentation Consistency Enforcement ───────────────────────────────
  api-doc-check:
    name: API Contract Consistency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API docs updated when controller annotations change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CONTROLLER_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" -- '*.java' \
            | grep -E '^\+.*@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)' \
            | grep -v '^+++' || true)

          if [ -z "$CONTROLLER_CHANGES" ]; then
            echo "No REST endpoint annotation changes — skipping doc check."
            exit 0
          fi

          echo "REST endpoint annotation changes found:"
          echo "$CONTROLLER_CHANGES"

          DOC_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" --name-only \
            | grep -E '(card-service/docs/openapi-snapshot\.yaml|docs/card-api-reference\.html|docs/cba-postman-collection-v2\.json)' \
            || true)

          if [ -z "$DOC_CHANGES" ]; then
            echo "FAIL: Controller annotations changed without updating card-service API docs."
            echo "Update one of:"
            echo "  - card-service/docs/openapi-snapshot.yaml"
            echo "  - docs/card-api-reference.html"
            echo "  - docs/cba-postman-collection-v2.json"
            exit 1
          fi

          echo "API docs updated alongside controller changes: $DOC_CHANGES"

  # ─── Unit + Integration Tests ─────────────────────────────────────────────────
  test:
    name: Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        working-directory: card-service
        run: mvn test --no-transfer-progress

      - name: Run integration tests (Testcontainers + OpenAPI snapshot)
        working-directory: card-service
        run: mvn verify -Pfull-integration --no-transfer-progress
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-service-test-reports
          path: card-service/target/surefire-reports/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Card Service Tests
          path: card-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-empty: false

  # ─── Security — OWASP Dependency Check ───────────────────────────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # A full NVD download via the API took ~40 min and sometimes never finished.
    # With the mirror + cache below a run is a few minutes; this caps a stall.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The NVD database is cached with restore/save split, NOT plain actions/cache:
      # plain actions/cache only saves when the job succeeds, and this job fails
      # whenever it finds a CVSS >= 7 CVE — so the cache was never written and every
      # run re-downloaded all ~380k NVD records. One cache entry per day.
      - name: Compute NVD cache key
        id: nvd-key
        run: echo "key=owasp-nvd-${{ runner.os }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        working-directory: card-service
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Plugin pinned: unpinned, Maven resolves whatever is newest on each run.
        # nvdDatafeedUrl = the DependencyCheck project's public NVD mirror (bulk
        # json.gz per year) — far faster than paging the NVD API. The OSS Index
        # analyzer now requires credentials we don't have, so it's disabled explicitly.
        run: |
          mvn org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=../docs/owasp-suppressions.xml \
            -DnvdApiKey="$NVD_API_KEY" \
            -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/ \
            -DnvdValidForHours=24 \
            -DnvdMaxRetryCount=5 \
            -DnvdApiDelay=2000 \
            -DretireJsAnalyzerEnabled=false \
            -DossIndexAnalyzerEnabled=false \
            --no-transfer-progress

      - name: Save NVD database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.nvd-key.outputs.key }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-service-owasp-report
          path: card-service/target/dependency-check-report.html

  # ─── Docker Build + Push ─────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, owasp-check, api-doc-check]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.test.result == 'success' &&
      needs.owasp-check.result == 'success' &&
      (needs.api-doc-check.result == 'success' || needs.api-doc-check.result == 'skipped')
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR (skip tests)
        working-directory: card-service
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cba-card-service
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: card-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Trivy image ref
        run: |
          LOWER_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "TRIVY_IMAGE_REF=ghcr.io/${LOWER_OWNER}/cba-platform/cba-card-service:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TRIVY_IMAGE_REF }}
          format: sarif
          output: trivy-card-service.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-card-service.sarif

  # ─── Deploy ──────────────────────────────────────────────────────────────────
  # Rewritten Session 125 cont. 10 — the previous jobs could never have deployed:
  #  1. Skip propagation: api-doc-check is PR-only, so on a push it is SKIPPED. A plain
  #     job-level `if` carries an implicit success() that sees that skip through `docker`
  #     and skips the deploy even when docker succeeded. Hence always() + an explicit
  #     needs.docker.result check.
  #  2-5. The image rewrite targeted a file that does not exist (deployment.yaml vs
  #     <service>-deployment.yaml), searched for the wrong image (cba/<svc>:latest), wrote the
  #     full 40-char SHA while metadata-action pushes the 7-char one, and used the
  #     mixed-case github.repository (not a valid OCI reference). It now rewrites the real
  #     line to ghcr.io/<lowercase repo>/<image>:sha-<7> and FAILS if nothing changed, so a
  #     rollout can never silently keep :latest.
  #  6. (backend) `kubectl apply -f infrastructure/k8s/` is not recursive, so it applied
  #     only namespace.yaml. Each job now applies ONLY its own service directory — NOT
  #     `-R` on the whole tree, which would push secrets/ with its <CHANGE_ME> placeholders
  #     over real cluster secrets. Namespace, secrets, configmaps and data stores are a
  #     one-time cluster bootstrap, not part of a per-service deploy.
  #  7. The rollout waited on deployment/cba-<svc>; the Deployments are named <svc>.
  # No cluster is configured yet (docs/deferred-backlog.md item 8): each job checks for
  # its kubeconfig secret first and skips cleanly with a notice when it is absent, so a
  # missing cluster reports as "not configured" rather than a red main.

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && github.ref == 'refs/heads/develop'
    environment: staging
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
    steps:
      - name: Check cluster credentials
        id: creds
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::notice title=Deploy skipped::KUBE_CONFIG_STAGING is not set - no cluster is configured. See docs/deferred-backlog.md item 8."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - name: Set up kubectl
        if: steps.creds.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Pin the image to this commit
        if: steps.creds.outputs.configured == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/cba-card-service:sha-${GITHUB_SHA::7}"
          MANIFEST="infrastructure/k8s/card-service/card-service-deployment.yaml"
          sed -i -E "s|image: ghcr\.io/[^[:space:]]+/cba-card-service:[^[:space:]]+|image: ${IMAGE}|" "$MANIFEST"
          grep -q "image: ${IMAGE}$" "$MANIFEST" \
            || { echo "::error::image not rewritten in $MANIFEST - refusing to deploy :latest"; exit 1; }
          echo "Deploying ${IMAGE}"

      - name: Apply card-service manifests
        if: steps.creds.outputs.configured == 'true'
        run: kubectl apply -f infrastructure/k8s/card-service/ --kubeconfig="$RUNNER_TEMP/kubeconfig"

      - name: Wait for rollout
        if: steps.creds.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/card-service \
            -n cba-platform \
            --kubeconfig="$RUNNER_TEMP/kubeconfig" \
            --timeout=300s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && github.ref == 'refs/heads/main'
    environment: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
    steps:
      - name: Check cluster credentials
        id: creds
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::notice title=Deploy skipped::KUBE_CONFIG_PROD is not set - no cluster is configured. See docs/deferred-backlog.md item 8."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - name: Set up kubectl
        if: steps.creds.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Pin the image to this commit
        if: steps.creds.outputs.configured == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/cba-card-service:sha-${GITHUB_SHA::7}"
          MANIFEST="infrastructure/k8s/card-service/card-service-deployment.yaml"
          sed -i -E "s|image: ghcr\.io/[^[:space:]]+/cba-card-service:[^[:space:]]+|image: ${IMAGE}|" "$MANIFEST"
          grep -q "image: ${IMAGE}$" "$MANIFEST" \
            || { echo "::error::image not rewritten in $MANIFEST - refusing to deploy :latest"; exit 1; }
          echo "Deploying ${IMAGE}"

      - name: Apply card-service manifests
        if: steps.creds.outputs.configured == 'true'
        run: kubectl apply -f infrastructure/k8s/card-service/ --kubeconfig="$RUNNER_TEMP/kubeconfig"

      - name: Wait for rollout
        if: steps.creds.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/card-service \
            -n cba-platform \
            --kubeconfig="$RUNNER_TEMP/kubeconfig" \
            --timeout=300s
