# SonarCloud — CBA Platform
sonar.organization=${SONAR_ORG}
sonar.projectKey=cba-platform

# Multi-module projects
sonar.modules=backend,web

# ── Backend (Java) ─────────────────────────────────────────────────────────────
backend.sonar.projectName=CBA Backend
backend.sonar.projectBaseDir=backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
backend.sonar.exclusions=**/generated/**,**/dto/**

# ── Web (TypeScript/Angular) ───────────────────────────────────────────────────
web.sonar.projectName=CBA Web Portal
web.sonar.projectBaseDir=web
web.sonar.sources=src/app
web.sonar.tests=src/app
web.sonar.test.inclusions=**/*.spec.ts
web.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
web.sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ── Quality Gates ──────────────────────────────────────────────────────────────
# New code must have:
#   - Coverage >= 70%
#   - 0 Security Hotspots unreviewed
#   - 0 Blocker/Critical issues
#   - Duplicated Lines < 3%
