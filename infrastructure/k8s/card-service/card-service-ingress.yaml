# Replace card-api.cba.example.com with your actual domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: card-service-ingress
  namespace: cba-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Uncomment for TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # tls:
  #   - hosts:
  #       - card-api.cba.example.com
  #     secretName: card-service-tls
  rules:
    - host: card-api.cba.example.com
      http:
        paths:
          # Never public: fep-service's internal endpoints (PAN de-tokenisation, authorization)
          # and actuator. Longest prefix wins over "/", and card-service-blackhole has no
          # endpoints, so the controller answers 503. card-service still checks the FEP_SERVICE
          # token on /api/v1/internal/**; this is the second fence, not the only one.
          - path: /api/v1/internal
            pathType: Prefix
            backend:
              service:
                name: card-service-blackhole
                port:
                  number: 80
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: card-service-blackhole
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: card-service
                port:
                  number: 8081
