version: 2
updates:
  # Java (Maven) dependencies
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns: ['org.springframework.boot:*', 'org.springframework:*']
      security:
        patterns: ['org.springframework.security:*', 'org.keycloak:*']
      testing:
        patterns: ['org.junit:*', 'org.mockito:*', 'org.testcontainers:*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Java (Maven) dependencies — card-service microservice
  # Ensures card-service deps (e.g. com.github.mwiede:jsch) get security-patch PRs.
  # Without this, a CVE >= 7 would fail card-service OWASP CI with no auto-fix path.
  - package-ecosystem: maven
    directory: /card-service
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns: ['org.springframework.boot:*', 'org.springframework:*']
      security:
        patterns: ['org.springframework.security:*', 'org.keycloak:*']
      testing:
        patterns: ['org.junit:*', 'org.mockito:*', 'org.testcontainers:*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Java (Maven) dependencies — fep-service microservice
  - package-ecosystem: maven
    directory: /fep-service
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns: ['org.springframework.boot:*', 'org.springframework:*']
      testing:
        patterns: ['org.junit:*', 'org.mockito:*', 'org.testcontainers:*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Angular (npm) dependencies
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ['@angular/*']
      angular-material:
        patterns: ['@angular/material', '@angular/cdk']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Flutter / Dart dependencies
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'eclipse-temurin'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
