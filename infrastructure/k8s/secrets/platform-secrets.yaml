# ============================================================
# CBA Platform — Kubernetes Secrets
#
# IMPORTANT: This file contains PLACEHOLDER values only.
# Replace every <CHANGE_ME> before applying to any cluster.
#
# In production, manage these with an external secrets operator:
#   - AWS Secrets Manager + External Secrets Operator
#   - Azure Key Vault + External Secrets Operator
#   - HashiCorp Vault + Vault Agent Injector
#   - Sealed Secrets (Bitnami) for GitOps workflows
#
# Apply:
#   kubectl apply -f secrets/platform-secrets.yaml
# ============================================================

# ─── PostgreSQL — Main ────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-main-secret
  namespace: cba-platform
type: Opaque
stringData:
  POSTGRES_MAIN_PASSWORD: "<CHANGE_ME>"
  KEYCLOAK_DB_PASSWORD: "<CHANGE_ME>"

---
# ─── PostgreSQL — Card ────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-card-secret
  namespace: cba-platform
type: Opaque
stringData:
  POSTGRES_CARD_PASSWORD: "<CHANGE_ME>"

---
# ─── Keycloak ─────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: cba-platform
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "<CHANGE_ME>"

---
# ─── Backend (monolith) ───────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: cba-platform
type: Opaque
stringData:
  # Jasypt AES-256 master key — minimum 32 characters
  # Generate: openssl rand -base64 48 | tr -d '\n'
  JASYPT_ENCRYPTOR_PASSWORD: "<CHANGE_ME_MIN_32_CHARS>"
  SPRING_DATASOURCE_PASSWORD: "<CHANGE_ME>"

---
# ─── Card Service ─────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: card-service-secret
  namespace: cba-platform
type: Opaque
stringData:
  JASYPT_ENCRYPTOR_PASSWORD: "<CHANGE_ME_MIN_32_CHARS>"
  SPRING_DATASOURCE_PASSWORD: "<CHANGE_ME>"

---
# ─── FEP Service ──────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: fep-service-secret
  namespace: cba-platform
type: Opaque
stringData:
  # SOFTWARE for dev/staging; THALES for production HSM
  FEP_HSM_PROVIDER: "SOFTWARE"
  # Thales payShield connection (only required when provider=THALES)
  # THALES_HSM_HOST: "hsm.internal.example.com"
  # THALES_HSM_PORT: "1500"
