name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cba-backend

jobs:
  # ─── API Documentation Consistency Enforcement ───────────────────────────────
  api-doc-check:
    name: API Contract Consistency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API docs are updated when controller annotations change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CONTROLLER_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" -- '*.java' \
            | grep -E '^\+.*@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping|RequestMapping)' \
            | grep -v '^+++' || true)

          if [ -z "$CONTROLLER_CHANGES" ]; then
            echo "No REST endpoint annotation changes detected — skipping doc check."
            exit 0
          fi

          echo "REST endpoint annotation changes found:"
          echo "$CONTROLLER_CHANGES"

          DOC_CHANGES=$(git diff "$BASE_SHA" "$HEAD_SHA" --name-only \
            | grep -E '(docs/openapi-snapshot\.yaml|docs/api-reference\.html|docs/cba-postman-collection-v2\.json)' \
            || true)

          if [ -z "$DOC_CHANGES" ]; then
            echo "FAIL: REST endpoint annotations changed but no API documentation was updated."
            echo "Update at least one of:"
            echo "  - backend/docs/openapi-snapshot.yaml  (mvn verify -Pfull-integration -Dupdate.api.snapshot=true)"
            echo "  - docs/api-reference.html"
            echo "  - docs/cba-postman-collection-v2.json"
            echo "See CLAUDE.md 'Mandatory Documentation Updates' for details."
            exit 1
          fi

          echo "API documentation updated alongside controller changes:"
          echo "$DOC_CHANGES"

  # ─── Unit + Integration Tests ────────────────────────────────────────────────
  test:
    name: Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        working-directory: backend
        run: mvn test --no-transfer-progress

      - name: Run integration tests (Testcontainers + PostgreSQL)
        working-directory: backend
        run: mvn verify -Pfull-integration --no-transfer-progress -Djacoco.skip=true -Dspotbugs.skip=true
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  # ─── Code Quality — SonarCloud ───────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ vars.SONAR_ORG }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=cba-platform_backend \
            -Dsonar.organization="${SONAR_ORG}" \
            -Dsonar.host.url=https://sonarcloud.io \
            --no-transfer-progress

  # ─── Security — OWASP Dependency Check ───────────────────────────────────────
  # NOTE: First run downloads ~346K NVD records (~70 min locally, ~3h in CI).
  # Subsequent runs do a delta update (seconds) using the owasp-nvd-* cache key.
  # timeout-minutes: 180 covers the worst-case first-time download.
  # Suppressions: docs/owasp-suppressions.xml (Netty/Spring/Tomcat justified 2026-04-24)
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionsLocation=../docs/owasp-suppressions.xml \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DnvdMaxRetryCount=5 \
            -DnvdApiDelay=2000 \
            -DretireJsAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false \
            -DassemblyAnalyzerEnabled=false \
            -DhoursToWaitBeforeChecking=24 \
            --no-transfer-progress

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html

  # ─── Security — SpotBugs Static Analysis ─────────────────────────────────────
  spotbugs:
    name: SpotBugs Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run SpotBugs
        working-directory: backend
        run: mvn compile spotbugs:check --no-transfer-progress

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml

  # ─── Docker Build + Push ─────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, owasp-check, spotbugs, api-doc-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR (skip tests — already ran)
        working-directory: backend
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cba-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/cba-backend:sha-${{ github.sha }}
          format: sarif
          output: trivy-docker.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-docker.sarif

  # ─── Deploy to Staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig.yml

      - name: Update image in manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository }}/cba-backend
        run: |
          sed -i "s|cba/backend:latest|${REGISTRY}:${IMAGE_TAG}|g" \
            infrastructure/k8s/backend/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f infrastructure/k8s/ --kubeconfig=/tmp/kubeconfig.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cba-backend \
            -n cba-platform \
            --kubeconfig=/tmp/kubeconfig.yml \
            --timeout=300s

  # ─── Deploy to Production ─────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: echo "${KUBE_CONFIG}" | base64 -d > /tmp/kubeconfig.yml

      - name: Update image in manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository }}/cba-backend
        run: |
          sed -i "s|cba/backend:latest|${REGISTRY}:${IMAGE_TAG}|g" \
            infrastructure/k8s/backend/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f infrastructure/k8s/ --kubeconfig=/tmp/kubeconfig.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cba-backend \
            -n cba-platform \
            --kubeconfig=/tmp/kubeconfig.yml \
            --timeout=300s
