<div class="kpi-card" [class]="'kpi-card--' + color">
  <div class="kpi-card__header">
    <span class="kpi-card__title">{{ title }}</span>
    <span class="kpi-card__icon material-icons">{{ icon }}</span>
  </div>
  <div class="kpi-card__value">{{ value }}</div>
  @if (subtitle || trendValue) {
    <div class="kpi-card__footer">
      <span class="kpi-card__trend" [class.kpi-card__trend--up]="trend === 'up'" [class.kpi-card__trend--down]="trend === 'down'">
        @if (trend === 'up') {
          <span class="material-icons">trending_up</span>
        }
        @if (trend === 'down') {
          <span class="material-icons">trending_down</span>
        }
        {{ trendValue }}
      </span>
      <span class="kpi-card__subtitle">{{ subtitle }}</span>
    </div>
  }
</div>
