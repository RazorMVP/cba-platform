name: FEP Service CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─── Change detection ────────────────────────────────────────────────────────
  # Path filtering happens here, not in `on:`, so the gate below reports on every
  # pull request (same pattern as backend/card-service/web CI).
  changes:
    name: Detect fep-service changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          PATTERN: '^(fep\-service/|\.github/workflows/fep\-service\-ci\.yml$)'
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          # New branch, force push or unknown base: run everything rather than guess.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Unit tests ──────────────────────────────────────────────────────────────
  # fep-service had no CI until it began carrying a credential (Keycloak client
  # cba-fep-service). No Docker needed: the socket and context tests run in-process.
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: fep-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fep-service-test-reports
          path: fep-service/target/surefire-reports/
          retention-days: 7

  # ─── Gate ────────────────────────────────────────────────────────────────────
  gate:
    name: FEP Service CI gate
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gated job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
